<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self' https:; base-uri 'none'; form-action 'none'">
  <title>Capybara</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --bg-light: #f7f8f3; --bg-dark: #14130f;
      --text-light: #242018; --text-dark: #efeadf;
      --muted-light: #6d6759; --muted-dark: #a59f90;
      --button-light: #f3b52b; --button-dark: #f3b52b;
      --button-text-light: #17130a; --button-text-dark: #17130a;
      --track-light: #e6e1d3; --track-dark: #34312a;
      --bg: var(--bg-light); --text: var(--text-light); --muted: var(--muted-light);
      --button: var(--button-light); --button-text: var(--button-text-light); --track: var(--track-light);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: var(--bg-dark); --text: var(--text-dark); --muted: var(--muted-dark); --track: var(--track-dark); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 "Avenir Next", Avenir, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      display: grid; place-items: center; padding: 24px 16px max(24px, env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 360px; text-align: center; }
    h1 { font-size: 30px; letter-spacing: 0.02em; margin: 0 0 40px; font-weight: 700; }
    .entry { display: grid; justify-items: center; gap: 20px; min-height: 148px; }
    .message { margin: 0; color: var(--muted); }
    .entry:not([data-state="testing"]) .message { color: var(--text); }
    .note { margin: -12px 0 0; color: var(--muted); font-size: 15px; }
    .go, .retry {
      display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px;
      padding: 0 20px; border: 0; border-radius: 14px; line-height: 1;
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
      background: var(--button); color: var(--button-text);
    }
    .retry { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--track); }
    .go:focus-visible, .retry:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    [hidden] { display: none !important; }

    progress.spinner {
      --size: 40px; --thickness: 3px; --spin: 1.2s;
      width: var(--size); height: var(--size); border-radius: 50%; appearance: none; -webkit-appearance: none;
      border: 0; background: conic-gradient(var(--button) 0 25%, transparent 0) var(--track);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), #000 calc(100% - var(--thickness)));
      mask: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), #000 calc(100% - var(--thickness)));
      animation: spin var(--spin) linear infinite;
    }
    progress.spinner::-webkit-progress-bar, progress.spinner::-webkit-progress-value { background: none; display: none; }
    progress.spinner::-moz-progress-bar { background: none; display: none; }
    .entry:not([data-state="testing"]) progress.spinner { display: none; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { progress.spinner { --spin: 6s; } }
    @media (forced-colors: active) { progress.spinner { forced-color-adjust: none; background: conic-gradient(CanvasText 0 25%, Canvas 0); } }
  </style>
</head>
<body>
  <main>
    <h1>Capybara</h1>
    <section class="entry" data-entry data-state="testing" aria-live="polite">
      <progress class="spinner" aria-label="正在寻找"></progress>
      <p class="message" data-message>正在找能打开的入口…</p>
      <p class="note" data-note hidden>打开 App 直接用，或稍后再试</p>
      <a class="go" data-go href="#" rel="noreferrer" hidden>进入</a>
      <button class="retry" data-retry type="button" hidden>再试一次</button>
    </section>
    <noscript><p class="message">这个页面需要开启脚本。</p></noscript>
  </main>
  <script src="entry.js" defer></script>
</body>
</html>
